<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Minimal job description match illustration</title>
  <desc id="desc">A transparent 2D vector illustration showing a pasted job description matched against real built work and evidence.</desc>
  <defs>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#020617" flood-opacity="0.34" />
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#14b8a6" flood-opacity="0.16" />
    </filter>
    <linearGradient id="matchLine" x1="242" y1="0" x2="1164" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5eead4" stop-opacity="0.12" />
      <stop offset="0.5" stop-color="#5eead4" stop-opacity="0.96" />
      <stop offset="1" stop-color="#5eead4" stop-opacity="0.12" />
    </linearGradient>
    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }

      .sans {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
    </style>
  </defs>

  <g opacity="0.22">
    <path d="M214 124 H1226" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 18" />
    <path d="M214 596 H1226" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 18" />
    <path d="M306 96 V624" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 18" />
    <path d="M1134 96 V624" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 18" />
  </g>

  <g fill="none" stroke="url(#matchLine)" stroke-linecap="round">
    <path d="M574 360 C622 360 642 360 682 360" stroke-width="5" />
    <path d="M758 360 C812 240 854 210 906 210" stroke-width="4" />
    <path d="M758 360 C812 360 858 360 912 360" stroke-width="5" />
    <path d="M758 360 C812 480 854 510 906 510" stroke-width="4" />
  </g>

  <g transform="translate(230 174)" filter="url(#softGlow)">
    <rect width="344" height="372" rx="38" fill="#f8fafc" />
    <rect x="1" y="1" width="342" height="370" rx="37" fill="none" stroke="#ccfbf1" stroke-width="2" />
    <text class="sans" x="42" y="62" fill="#0f172a" font-size="28" font-weight="740" letter-spacing="0">Job description</text>
    <text class="mono" x="42" y="96" fill="#64748b" font-size="18" letter-spacing="0">paste requirements</text>

    <rect x="42" y="132" width="260" height="16" rx="8" fill="#0f172a" opacity="0.72" />
    <rect x="42" y="170" width="224" height="12" rx="6" fill="#64748b" opacity="0.28" />
    <rect x="42" y="200" width="270" height="12" rx="6" fill="#64748b" opacity="0.24" />
    <rect x="42" y="230" width="198" height="12" rx="6" fill="#64748b" opacity="0.24" />

    <g transform="translate(42 284)">
      <rect width="110" height="42" rx="21" fill="#ecfdf5" stroke="#5eead4" stroke-width="2" />
      <circle cx="28" cy="21" r="6" fill="#0f766e" />
      <text class="mono" x="68" y="27" fill="#0f766e" font-size="16" letter-spacing="0" text-anchor="middle">API</text>
    </g>
    <g transform="translate(168 284)">
      <rect width="132" height="42" rx="21" fill="#ecfdf5" stroke="#5eead4" stroke-width="2" />
      <circle cx="28" cy="21" r="6" fill="#0f766e" />
      <text class="mono" x="80" y="27" fill="#0f766e" font-size="16" letter-spacing="0" text-anchor="middle">systems</text>
    </g>
  </g>

  <g transform="translate(636 276)" filter="url(#softGlow)">
    <circle cx="84" cy="84" r="84" fill="#0f172a" stroke="#5eead4" stroke-width="3" />
    <circle cx="84" cy="84" r="56" fill="none" stroke="#ccfbf1" stroke-width="2" stroke-dasharray="5 12" opacity="0.72" />
    <path d="M63 84 L78 100 L109 66" stroke="#5eead4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M112 112 L140 140" stroke="#ccfbf1" stroke-width="8" stroke-linecap="round" />
    <text class="mono" x="84" y="192" fill="#ccfbf1" font-size="18" letter-spacing="0" text-anchor="middle">match</text>
  </g>

  <g transform="translate(906 144)" filter="url(#softGlow)">
    <rect width="334" height="132" rx="32" fill="#f8fafc" />
    <rect x="1" y="1" width="332" height="130" rx="31" fill="none" stroke="#ccfbf1" stroke-width="2" />
    <circle cx="70" cy="66" r="38" fill="#0f766e" opacity="0.12" />
    <path d="M52 66 L66 81 L92 51" stroke="#0f766e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <text class="sans" x="132" y="61" fill="#0f172a" font-size="25" font-weight="730" letter-spacing="0">Built feature</text>
    <text class="mono" x="132" y="94" fill="#64748b" font-size="17" letter-spacing="0">shipped evidence</text>
  </g>

  <g transform="translate(928 294)" filter="url(#softGlow)">
    <rect width="356" height="132" rx="32" fill="#f8fafc" />
    <rect x="1" y="1" width="354" height="130" rx="31" fill="none" stroke="#ccfbf1" stroke-width="2" />
    <rect x="44" y="32" width="72" height="82" rx="14" fill="#0f766e" opacity="0.12" />
    <path d="M60 50 H100 M60 68 H100 M60 86 H88" stroke="#0f766e" stroke-width="5" stroke-linecap="round" />
    <path d="M104 32 V52 H124" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <text class="sans" x="152" y="61" fill="#0f172a" font-size="25" font-weight="730" letter-spacing="0">Decision record</text>
    <text class="mono" x="152" y="94" fill="#64748b" font-size="17" letter-spacing="0">why it exists</text>
  </g>

  <g transform="translate(906 444)" filter="url(#softGlow)">
    <rect width="334" height="132" rx="32" fill="#f8fafc" />
    <rect x="1" y="1" width="332" height="130" rx="31" fill="none" stroke="#ccfbf1" stroke-width="2" />
    <path d="M48 42 H110 C122 42 130 50 130 62 V96 H34 V58 C34 49 41 42 48 42 Z" fill="#0f766e" opacity="0.12" />
    <path d="M34 62 H130 V96 H34 Z M48 42 H78 L90 56 H130" stroke="#0f766e" stroke-width="5" stroke-linejoin="round" />
    <text class="sans" x="158" y="61" fill="#0f172a" font-size="25" font-weight="730" letter-spacing="0">Repository proof</text>
    <text class="mono" x="158" y="94" fill="#64748b" font-size="17" letter-spacing="0">actual code</text>
  </g>
</svg>
