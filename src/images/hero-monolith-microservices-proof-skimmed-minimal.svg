<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Minimal monolith to microservices proof skimmed illustration</title>
  <desc id="desc">A transparent 2D vector illustration contrasting concrete event-driven microservices migration proof with a vague resume claim that recruiters skim past.</desc>
  <defs>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#020617" flood-opacity="0.34" />
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#14b8a6" flood-opacity="0.16" />
    </filter>
    <linearGradient id="proofLine" x1="210" y1="0" x2="1228" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5eead4" stop-opacity="0.94" />
      <stop offset="0.5" stop-color="#5eead4" stop-opacity="0.76" />
      <stop offset="0.8" stop-color="#94a3b8" stop-opacity="0.24" />
      <stop offset="1" stop-color="#94a3b8" stop-opacity="0.08" />
    </linearGradient>
    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }

      .sans {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
    </style>
  </defs>

  <g opacity="0.22">
    <path d="M214 124 H1226" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 18" />
    <path d="M214 596 H1226" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 18" />
    <path d="M306 96 V624" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 18" />
    <path d="M1134 96 V624" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 18" />
  </g>

  <g fill="none" stroke="url(#proofLine)" stroke-linecap="round">
    <path d="M556 360 C638 360 678 360 738 360" stroke-width="5" />
    <path d="M818 360 C900 360 960 360 1022 360" stroke-width="4" stroke-dasharray="10 16" />
  </g>

  <g transform="translate(190 136)" filter="url(#softGlow)">
    <rect width="392" height="448" rx="42" fill="#f8fafc" />
    <rect x="1" y="1" width="390" height="446" rx="41" fill="none" stroke="#ccfbf1" stroke-width="2" />

    <text class="mono" x="42" y="58" fill="#64748b" font-size="18" letter-spacing="0">migration proof</text>
    <text class="sans" x="42" y="116" fill="#0f172a" font-size="58" font-weight="780" letter-spacing="0">83 PRs</text>
    <text class="mono" x="42" y="154" fill="#0f766e" font-size="20" letter-spacing="0">6 months · zero downtime</text>

    <g transform="translate(42 196)">
      <rect x="0" y="44" width="96" height="96" rx="24" fill="#0f172a" stroke="#5eead4" stroke-width="3" />
      <rect x="22" y="66" width="52" height="52" rx="10" fill="#5eead4" opacity="0.14" stroke="#5eead4" stroke-width="3" />
      <text class="mono" x="48" y="168" fill="#64748b" font-size="16" letter-spacing="0" text-anchor="middle">monolith</text>

      <path d="M116 92 H158" stroke="#5eead4" stroke-width="4" stroke-linecap="round" />
      <path d="M148 82 L160 92 L148 102" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

      <circle cx="214" cy="56" r="31" fill="#ecfdf5" stroke="#0f766e" stroke-width="4" />
      <circle cx="298" cy="92" r="31" fill="#ecfdf5" stroke="#0f766e" stroke-width="4" />
      <circle cx="214" cy="128" r="31" fill="#ecfdf5" stroke="#0f766e" stroke-width="4" />
      <path d="M240 66 L272 82 M245 128 L270 106 M214 87 V97" stroke="#5eead4" stroke-width="4" stroke-linecap="round" />
      <path d="M201 56 H227 M214 43 V69 M285 92 H311 M298 79 V105 M201 128 H227 M214 115 V141" stroke="#0f766e" stroke-width="4" stroke-linecap="round" />
      <text class="mono" x="256" y="168" fill="#64748b" font-size="16" letter-spacing="0" text-anchor="middle">event services</text>
    </g>

    <g transform="translate(42 386)">
      <rect width="126" height="42" rx="21" fill="#ecfdf5" stroke="#5eead4" stroke-width="2" />
      <circle cx="28" cy="21" r="6" fill="#0f766e" />
      <text class="mono" x="78" y="27" fill="#0f766e" font-size="16" letter-spacing="0" text-anchor="middle">cutover</text>
      <rect x="148" width="126" height="42" rx="21" fill="#ecfdf5" stroke="#5eead4" stroke-width="2" />
      <circle cx="176" cy="21" r="6" fill="#0f766e" />
      <text class="mono" x="214" y="27" fill="#0f766e" font-size="16" letter-spacing="0" text-anchor="middle">0 down</text>
    </g>
  </g>

  <g transform="translate(660 262)" filter="url(#softGlow)">
    <circle cx="84" cy="98" r="82" fill="#0f172a" stroke="#5eead4" stroke-width="3" />
    <path d="M37 98 C50 72 73 60 84 60 C95 60 118 72 131 98 C118 124 95 136 84 136 C73 136 50 124 37 98 Z" fill="none" stroke="#ccfbf1" stroke-width="5" stroke-linejoin="round" opacity="0.88" />
    <circle cx="84" cy="98" r="19" fill="#5eead4" opacity="0.22" stroke="#5eead4" stroke-width="5" />
    <path d="M45 145 L123 51" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" />
    <text class="mono" x="84" y="207" fill="#94a3b8" font-size="18" letter-spacing="0" text-anchor="middle">skimmed proof</text>
  </g>

  <g transform="translate(954 166)" filter="url(#softGlow)">
    <rect width="360" height="388" rx="40" fill="#f8fafc" />
    <rect x="1" y="1" width="358" height="386" rx="39" fill="none" stroke="#ccfbf1" stroke-width="2" />

    <g transform="translate(42 44)">
      <circle cx="32" cy="32" r="32" fill="#0f766e" opacity="0.12" />
      <path d="M18 51 C23 38 41 38 46 51" stroke="#0f766e" stroke-width="6" stroke-linecap="round" />
      <circle cx="32" cy="25" r="12" stroke="#0f766e" stroke-width="6" />
      <rect x="82" y="12" width="152" height="14" rx="7" fill="#0f172a" opacity="0.72" />
      <rect x="82" y="44" width="202" height="10" rx="5" fill="#64748b" opacity="0.28" />
    </g>

    <text class="mono" x="42" y="154" fill="#64748b" font-size="18" letter-spacing="0">resume says</text>

    <g transform="translate(42 190)">
      <rect width="276" height="126" rx="28" fill="#0f172a" />
      <text class="sans" x="28" y="47" fill="#f8fafc" font-size="25" font-weight="720" letter-spacing="0">“implemented</text>
      <text class="sans" x="28" y="85" fill="#f8fafc" font-size="25" font-weight="720" letter-spacing="0">modern patterns”</text>
    </g>

    <g transform="translate(42 344)" opacity="0.54">
      <path d="M0 0 H276" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 12" />
      <text class="mono" x="138" y="31" fill="#94a3b8" font-size="17" letter-spacing="0" text-anchor="middle">proof flattened</text>
    </g>
  </g>
</svg>
