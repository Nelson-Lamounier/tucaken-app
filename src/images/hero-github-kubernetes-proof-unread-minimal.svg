<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Minimal GitHub Kubernetes proof unread illustration</title>
  <desc id="desc">A transparent 2D vector illustration contrasting concrete GitHub Kubernetes commit evidence with a vague resume containerisation claim that does not get read.</desc>
  <defs>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#020617" flood-opacity="0.34" />
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#14b8a6" flood-opacity="0.16" />
    </filter>
    <linearGradient id="proofLine" x1="224" y1="0" x2="1194" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5eead4" stop-opacity="0.94" />
      <stop offset="0.54" stop-color="#5eead4" stop-opacity="0.7" />
      <stop offset="0.82" stop-color="#94a3b8" stop-opacity="0.28" />
      <stop offset="1" stop-color="#94a3b8" stop-opacity="0.08" />
    </linearGradient>
    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }

      .sans {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
    </style>
  </defs>

  <g opacity="0.22">
    <path d="M214 124 H1226" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 18" />
    <path d="M214 596 H1226" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 18" />
    <path d="M306 96 V624" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 18" />
    <path d="M1134 96 V624" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 18" />
  </g>

  <g fill="none" stroke="url(#proofLine)" stroke-linecap="round">
    <path d="M520 360 C608 360 660 360 728 360" stroke-width="5" />
    <path d="M812 360 C900 360 966 360 1030 360" stroke-width="4" stroke-dasharray="10 16" />
  </g>

  <g transform="translate(220 156)" filter="url(#softGlow)">
    <rect width="360" height="408" rx="40" fill="#f8fafc" />
    <rect x="1" y="1" width="358" height="406" rx="39" fill="none" stroke="#ccfbf1" stroke-width="2" />

    <g transform="translate(42 42)">
      <rect width="124" height="48" rx="24" fill="#0f172a" />
      <path d="M31 16 V34 M31 16 H57 M57 16 V26 M31 26 H45 M45 26 V34" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <text class="mono" x="86" y="31" fill="#ccfbf1" font-size="16" letter-spacing="0" text-anchor="middle">GitHub</text>
    </g>

    <text class="sans" x="42" y="144" fill="#0f172a" font-size="66" font-weight="780" letter-spacing="0">47</text>
    <text class="sans" x="132" y="144" fill="#0f172a" font-size="32" font-weight="740" letter-spacing="0">commits</text>
    <text class="mono" x="42" y="184" fill="#0f766e" font-size="20" letter-spacing="0">this month</text>
    <text class="mono" x="42" y="218" fill="#64748b" font-size="18" letter-spacing="0">scaling Kubernetes clusters</text>

    <g transform="translate(48 268)">
      <circle cx="52" cy="42" r="26" fill="#0f766e" opacity="0.12" stroke="#0f766e" stroke-width="4" />
      <circle cx="138" cy="42" r="26" fill="#0f766e" opacity="0.12" stroke="#0f766e" stroke-width="4" />
      <circle cx="224" cy="42" r="26" fill="#0f766e" opacity="0.12" stroke="#0f766e" stroke-width="4" />
      <path d="M78 42 H112 M164 42 H198 M138 68 V92 M92 92 H184" stroke="#5eead4" stroke-width="4" stroke-linecap="round" />
      <rect x="68" y="92" width="140" height="42" rx="21" fill="#ecfdf5" stroke="#5eead4" stroke-width="2" />
      <text class="mono" x="138" y="119" fill="#0f766e" font-size="16" letter-spacing="0" text-anchor="middle">cluster scale</text>
    </g>
  </g>

  <g transform="translate(666 262)" filter="url(#softGlow)">
    <circle cx="84" cy="98" r="82" fill="#0f172a" stroke="#5eead4" stroke-width="3" />
    <path d="M37 98 C50 72 73 60 84 60 C95 60 118 72 131 98 C118 124 95 136 84 136 C73 136 50 124 37 98 Z" fill="none" stroke="#ccfbf1" stroke-width="5" stroke-linejoin="round" opacity="0.88" />
    <circle cx="84" cy="98" r="19" fill="#5eead4" opacity="0.22" stroke="#5eead4" stroke-width="5" />
    <path d="M45 145 L123 51" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" />
    <text class="mono" x="84" y="207" fill="#94a3b8" font-size="18" letter-spacing="0" text-anchor="middle">unread proof</text>
  </g>

  <g transform="translate(954 166)" filter="url(#softGlow)">
    <rect width="360" height="388" rx="40" fill="#f8fafc" />
    <rect x="1" y="1" width="358" height="386" rx="39" fill="none" stroke="#ccfbf1" stroke-width="2" />

    <g transform="translate(42 44)">
      <circle cx="32" cy="32" r="32" fill="#0f766e" opacity="0.12" />
      <path d="M18 51 C23 38 41 38 46 51" stroke="#0f766e" stroke-width="6" stroke-linecap="round" />
      <circle cx="32" cy="25" r="12" stroke="#0f766e" stroke-width="6" />
      <rect x="82" y="12" width="152" height="14" rx="7" fill="#0f172a" opacity="0.72" />
      <rect x="82" y="44" width="202" height="10" rx="5" fill="#64748b" opacity="0.28" />
    </g>

    <text class="mono" x="42" y="154" fill="#64748b" font-size="18" letter-spacing="0">resume says</text>

    <g transform="translate(42 190)">
      <rect width="276" height="126" rx="28" fill="#0f172a" />
      <text class="sans" x="28" y="46" fill="#f8fafc" font-size="25" font-weight="720" letter-spacing="0">“experienced with</text>
      <text class="sans" x="28" y="84" fill="#f8fafc" font-size="25" font-weight="720" letter-spacing="0">containerisation”</text>
    </g>

    <g transform="translate(42 344)" opacity="0.54">
      <path d="M0 0 H276" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 12" />
      <text class="mono" x="138" y="31" fill="#94a3b8" font-size="17" letter-spacing="0" text-anchor="middle">evidence left behind</text>
    </g>
  </g>
</svg>
