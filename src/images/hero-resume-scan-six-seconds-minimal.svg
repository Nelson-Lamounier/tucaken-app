<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Minimal resume scan illustration</title>
  <desc id="desc">A transparent 2D vector illustration of a recruiter scanning a resume in six seconds, designed for a dark hero background.</desc>
  <defs>
    <filter id="paperShadow" x="-30%" y="-20%" width="160%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#020617" flood-opacity="0.34" />
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#14b8a6" flood-opacity="0.14" />
    </filter>
    <linearGradient id="scanBeam" x1="420" y1="0" x2="1018" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5eead4" stop-opacity="0" />
      <stop offset="0.18" stop-color="#5eead4" stop-opacity="0.42" />
      <stop offset="0.5" stop-color="#99f6e4" stop-opacity="0.9" />
      <stop offset="0.82" stop-color="#5eead4" stop-opacity="0.42" />
      <stop offset="1" stop-color="#5eead4" stop-opacity="0" />
    </linearGradient>
    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }

      .sans {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
    </style>
  </defs>

  <g opacity="0.24">
    <path d="M216 132 H1224" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 18" />
    <path d="M216 588 H1224" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 18" />
    <path d="M286 96 V624" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 18" />
    <path d="M1154 96 V624" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 18" />
  </g>

  <g transform="translate(438 104)" filter="url(#paperShadow)">
    <rect x="0" y="0" width="564" height="512" rx="36" fill="#f8fafc" />
    <rect x="1" y="1" width="562" height="510" rx="35" fill="none" stroke="#ccfbf1" stroke-opacity="0.9" stroke-width="2" />

    <g transform="translate(56 58)">
      <circle cx="39" cy="39" r="39" fill="#0f766e" opacity="0.12" />
      <path d="M24 61 C29 47 50 47 55 61" stroke="#0f766e" stroke-width="6" stroke-linecap="round" />
      <circle cx="40" cy="31" r="14" stroke="#0f766e" stroke-width="6" />
      <rect x="104" y="10" width="220" height="18" rx="9" fill="#0f172a" opacity="0.88" />
      <rect x="104" y="48" width="304" height="12" rx="6" fill="#64748b" opacity="0.34" />
      <rect x="104" y="74" width="248" height="12" rx="6" fill="#64748b" opacity="0.24" />
    </g>

    <g transform="translate(56 174)">
      <rect x="0" y="0" width="452" height="22" rx="11" fill="#0f172a" opacity="0.78" />
      <rect x="0" y="54" width="378" height="14" rx="7" fill="#64748b" opacity="0.3" />
      <rect x="0" y="88" width="424" height="14" rx="7" fill="#64748b" opacity="0.22" />
      <rect x="0" y="122" width="334" height="14" rx="7" fill="#64748b" opacity="0.22" />
      <rect x="0" y="180" width="408" height="14" rx="7" fill="#64748b" opacity="0.28" />
      <rect x="0" y="214" width="286" height="14" rx="7" fill="#64748b" opacity="0.2" />
      <rect x="0" y="248" width="366" height="14" rx="7" fill="#64748b" opacity="0.2" />
    </g>

    <path d="M0 294 H564" stroke="url(#scanBeam)" stroke-width="18" stroke-linecap="round" />
    <path d="M0 294 H564" stroke="#14b8a6" stroke-width="2" stroke-linecap="round" />
    <circle cx="438" cy="294" r="10" fill="#14b8a6" />
    <circle cx="438" cy="294" r="28" fill="#14b8a6" opacity="0.12" />
  </g>

  <g transform="translate(312 212)">
    <circle cx="88" cy="88" r="80" fill="none" stroke="#e2e8f0" stroke-width="4" opacity="0.92" />
    <path d="M88 8 V38" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" />
    <path d="M64 -12 H112" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round" />
    <path d="M88 88 L88 45" stroke="#5eead4" stroke-width="8" stroke-linecap="round" />
    <path d="M88 88 L125 108" stroke="#5eead4" stroke-width="8" stroke-linecap="round" />
    <text class="sans" x="88" y="105" fill="#f8fafc" font-size="76" font-weight="760" letter-spacing="0" text-anchor="middle">6</text>
    <text class="mono" x="88" y="156" fill="#99f6e4" font-size="18" letter-spacing="0" text-anchor="middle">seconds</text>
  </g>

  <g transform="translate(980 226)">
    <path d="M0 124 C64 124 76 42 146 42" stroke="#5eead4" stroke-width="4" stroke-linecap="round" opacity="0.86" />
    <path d="M0 170 C72 170 88 88 168 88" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" opacity="0.54" />
    <circle cx="0" cy="124" r="7" fill="#5eead4" />
    <circle cx="146" cy="42" r="7" fill="#5eead4" />
    <circle cx="0" cy="170" r="6" fill="#e2e8f0" opacity="0.72" />
    <circle cx="168" cy="88" r="6" fill="#e2e8f0" opacity="0.72" />
    <rect x="190" y="8" width="180" height="70" rx="35" fill="#0f172a" stroke="#5eead4" stroke-width="2" />
    <text class="mono" x="280" y="51" fill="#ccfbf1" font-size="22" letter-spacing="0" text-anchor="middle">scan</text>
    <rect x="206" y="116" width="150" height="52" rx="26" fill="#0f172a" stroke="#e2e8f0" stroke-opacity="0.44" stroke-width="2" />
    <text class="mono" x="281" y="149" fill="#e2e8f0" font-size="18" letter-spacing="0" text-anchor="middle">shortlist</text>
  </g>
</svg>
