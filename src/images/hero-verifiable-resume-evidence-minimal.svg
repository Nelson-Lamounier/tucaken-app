    <rect x="1" y="1" width="364" height="130" rx="31" fill="none" stroke="#ccfbf1" stroke-width="2" />
    <rect x="40" y="32" width="72" height="82" rx="14" fill="#0f766e" opacity="0.12" />
    <path d="M56 50 H96 M56 68 H96 M56 86 H84" stroke="#0f766e" stroke-width="5" stroke-linecap="round" />
    <path d="M100 32 V52 H120" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <text class="sans" x="152" y="61" fill="#0f172a" font-size="25" font-weight="730" letter-spacing="0">Decision record</text>
    <text class="mono" x="152" y="94" fill="#64748b" font-size="17" letter-spacing="0">why it matters</text>
