      <path d="M19 54 C24 40 44 40 49 54" stroke="#0f766e" stroke-width="6" stroke-linecap="round" />
      <circle cx="34" cy="27" r="13" stroke="#0f766e" stroke-width="6" />
      <rect x="88" y="12" width="154" height="16" rx="8" fill="#0f172a" opacity="0.82" />
      <rect x="88" y="46" width="196" height="11" rx="5.5" fill="#64748b" opacity="0.28" />
      <rect x="88" y="70" width="148" height="11" rx="5.5" fill="#64748b" opacity="0.22" />
