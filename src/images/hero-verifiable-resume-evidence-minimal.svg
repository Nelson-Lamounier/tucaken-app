    <path d="M46 42 H110 C122 42 130 50 130 62 V96 H32 V58 C32 49 39 42 46 42 Z" fill="#0f766e" opacity="0.12" />
    <path d="M32 62 H130 V96 H32 Z M46 42 H78 L90 56 H130" stroke="#0f766e" stroke-width="5" stroke-linejoin="round" />
    <text class="sans" x="158" y="61" fill="#0f172a" font-size="25" font-weight="730" letter-spacing="0">Repository</text>
    <text class="mono" x="158" y="94" fill="#64748b" font-size="17" letter-spacing="0">source proof</text>
  </g>

  <g transform="translate(858 294)" filter="url(#softGlow)">
    <rect width="390" height="132" rx="32" fill="#f8fafc" />
    <rect x="1" y="1" width="388" height="130" rx="31" fill="none" stroke="#ccfbf1" stroke-width="2" />
    <circle cx="72" cy="66" r="39" fill="#0f766e" opacity="0.12" />
    <path d="M51 66 L66 82 L96 49" stroke="#0f766e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <text class="sans" x="136" y="61" fill="#0f172a" font-size="25" font-weight="730" letter-spacing="0">Shipped feature</text>
    <text class="mono" x="136" y="94" fill="#64748b" font-size="17" letter-spacing="0">work completed</text>
