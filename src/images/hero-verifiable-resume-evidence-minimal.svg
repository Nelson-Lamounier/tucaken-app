      <circle cx="30" cy="29" r="7" fill="#0f766e" />
      <rect x="54" y="20" width="138" height="10" rx="5" fill="#0f172a" opacity="0.72" />
      <path d="M214 23 L224 29 L214 35" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

