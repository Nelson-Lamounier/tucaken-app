    <path d="M84 38 L124 58 V91 C124 118 105 136 84 146 C63 136 44 118 44 91 V58 Z" fill="#5eead4" opacity="0.12" stroke="#5eead4" stroke-width="4" stroke-linejoin="round" />
    <path d="M62 89 L79 106 L109 73" stroke="#ccfbf1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <text class="mono" x="84" y="192" fill="#ccfbf1" font-size="18" letter-spacing="0" text-anchor="middle">verified</text>
  </g>

  <g transform="translate(818 126)" filter="url(#softGlow)">
