<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Minimal verifiable resume evidence illustration</title>
  <desc id="desc">A transparent 2D vector illustration showing resume claims linked to real evidence from shipped work.</desc>
  <defs>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#020617" flood-opacity="0.34" />
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#14b8a6" flood-opacity="0.16" />
    </filter>
    <linearGradient id="evidenceLine" x1="258" y1="0" x2="1178" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5eead4" stop-opacity="0.12" />
      <stop offset="0.5" stop-color="#5eead4" stop-opacity="0.96" />
      <stop offset="1" stop-color="#5eead4" stop-opacity="0.12" />
    </linearGradient>
    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }

      .sans {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
    </style>
  </defs>

  <g opacity="0.22">
    <path d="M214 124 H1226" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 18" />
    <path d="M214 596 H1226" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 18" />
    <path d="M306 96 V624" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 18" />
    <path d="M1134 96 V624" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 18" />
  </g>

  <g fill="none" stroke="url(#evidenceLine)" stroke-linecap="round">
    <path d="M570 250 C670 250 724 194 818 194" stroke-width="4" />
    <path d="M570 360 C666 360 724 360 818 360" stroke-width="5" />
    <path d="M570 470 C670 470 724 526 818 526" stroke-width="4" />
  </g>

  <g opacity="0.86">
    <circle cx="642" cy="250" r="7" fill="#5eead4" />
    <circle cx="686" cy="360" r="8" fill="#5eead4" />
    <circle cx="642" cy="470" r="7" fill="#5eead4" />
  </g>

