name: "Deploy (Dev)"

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, SHA)"
        required: false
        default: "main"
        type: string

  repository_dispatch:
    types: [deploy-tucaken-app-dev]

permissions:
  id-token: write
  contents: read

env:
  ENVIRONMENT: development
  AWS_REGION: "eu-west-1"
  IMAGE_TAG: "${{ github.sha }}-r${{ github.run_attempt }}"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-ref:
    name: Resolve Deploy Ref
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      ref: ${{ steps.targets.outputs.ref }}
    steps:
      - name: Compute ref
        id: targets
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          PAYLOAD_REF: ${{ github.event.client_payload.ref }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            REF="$PUSH_SHA"
          else
            REF="${INPUT_REF:-${PAYLOAD_REF:-main}}"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Deploy ref: $REF"

  build:
    name: Build Docker Image
    needs: [resolve-ref]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ vars.ENVIRONMENT || 'development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: false
          tags: tucaken-app:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=tucaken-app
          cache-to: type=gha,mode=max,scope=tucaken-app
          provenance: false
          outputs: type=docker,dest=/tmp/app-image.tar
          build-args: |
            NODE_ENV=production
            VITE_ADMIN_BASE_PATH=/admin

      - name: Cache Image
        uses: actions/cache/save@v4
        with:
          path: /tmp/app-image.tar
          key: app-image-${{ env.ENVIRONMENT }}-${{ github.run_id }}-${{ github.run_attempt }}

  push:
    name: Push to ECR
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ vars.ENVIRONMENT || 'development' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: ./.github/actions/configure-aws
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Restore Image from Cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/app-image.tar
          key: app-image-${{ env.ENVIRONMENT }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Load Docker Image
        run: docker load -i /tmp/app-image.tar

      - name: Resolve ECR URL
        id: resolve-ecr
        run: |
          ECR_URL=$(aws ssm get-parameter \
            --name "/shared/ecr-admin/${ENVIRONMENT}/repository-uri" \
            --query 'Parameter.Value' --output text)
          if [ -z "$ECR_URL" ] || [ "$ECR_URL" = "None" ]; then
            echo "::error::ECR URL not found in SSM"
            exit 1
          fi
          echo "::add-mask::$ECR_URL"
          echo "ecr-url=$ECR_URL" >> "$GITHUB_OUTPUT"

      - name: Push Image to ECR
        env:
          ECR_URL: ${{ steps.resolve-ecr.outputs.ecr-url }}
        run: |
          REGISTRY="${ECR_URL%%/*}"
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "$REGISTRY"
          docker tag "tucaken-app:${IMAGE_TAG}" "${ECR_URL}:${IMAGE_TAG}"
          docker push "${ECR_URL}:${IMAGE_TAG}"

  deploy:
    name: Update SSM (ArgoCD)
    needs: [push]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: ./.github/actions/configure-aws
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve Image URI
        id: resolve
        run: |
          ECR_URL=$(aws ssm get-parameter \
            --name "/shared/ecr-admin/${ENVIRONMENT}/repository-uri" \
            --query 'Parameter.Value' --output text)
          IMAGE_URI="${ECR_URL}:${IMAGE_TAG}"
          echo "::add-mask::$ECR_URL"
          echo "::add-mask::$IMAGE_URI"
          echo "image-uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Write Image URI to SSM
        env:
          IMAGE_URI: ${{ steps.resolve.outputs.image-uri }}
        run: |
          aws ssm put-parameter \
            --name "/start-admin/${ENVIRONMENT}/image-uri" \
            --value "$IMAGE_URI" \
            --type String --overwrite

  promote:
    name: Promote Rollout
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: ./.github/actions/configure-aws
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve Control-Plane Instance ID
        id: resolve-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:k8s:bootstrap-role,Values=control-plane" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --region "${AWS_REGION}" --output text 2>/dev/null || echo "")
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::Could not resolve control-plane instance ID"
            exit 1
          fi
          echo "::add-mask::$INSTANCE_ID"
          echo "instance-id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Rollout Paused + Promote (via SSM)
        env:
          INSTANCE_ID: ${{ steps.resolve-instance.outputs.instance-id }}
          IMAGE_TAG_ENV: ${{ env.IMAGE_TAG }}
        run: |
          REGION="${AWS_REGION}"

          SCRIPT=$(cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          ROLLOUT="start-admin"
          NAMESPACE="start-admin"
          PLUGIN="/usr/local/bin/kubectl-argo-rollouts"
          EXPECTED_TAG="__IMAGE_TAG__"

          if ! sudo test -f "$PLUGIN"; then
            sudo curl -sSLo "$PLUGIN" \
              https://github.com/argoproj/argo-rollouts/releases/latest/download/kubectl-argo-rollouts-linux-amd64
            sudo chmod +x "$PLUGIN"
          fi

          for i in $(seq 1 20); do
            SPEC_IMAGE=$(sudo kubectl get rollout "$ROLLOUT" -n "$NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "")
            if [[ "$SPEC_IMAGE" == *"$EXPECTED_TAG"* ]]; then
              echo "[PASS] ArgoCD synced new image: $SPEC_IMAGE"
              break
            fi
            [[ "$i" -eq 20 ]] && { echo "[FAIL] ArgoCD did not sync within 5 min"; exit 1; }
            sleep 15
          done

          for i in $(seq 1 24); do
            PHASE=$(sudo kubectl argo rollouts get rollout "$ROLLOUT" -n "$NAMESPACE" --no-color 2>/dev/null \
              | grep -E "^Status" | awk '{print $NF}' || true)
            [[ "$PHASE" == "Paused" ]] && { echo "[PASS] Rollout Paused"; break; }
            [[ "$PHASE" == "Healthy" ]] && { echo "[INFO] Already Healthy"; exit 0; }
            [[ "$PHASE" == "Degraded" || "$PHASE" == "Error" ]] && {
              echo "[FAIL] Rollout $PHASE"; exit 1;
            }
            sleep 15
          done

          sudo kubectl argo rollouts promote "$ROLLOUT" -n "$NAMESPACE"

          for i in $(seq 1 12); do
            PHASE=$(sudo kubectl argo rollouts get rollout "$ROLLOUT" -n "$NAMESPACE" --no-color 2>/dev/null \
              | grep -E "^Status" | awk '{print $NF}' || true)
            [[ "$PHASE" == "Healthy" ]] && { echo "[PASS] Healthy"; exit 0; }
            sleep 10
          done
          echo "[WARN] Rollout still converging"
          REMOTE_SCRIPT
          )

          SCRIPT="${SCRIPT//__IMAGE_TAG__/$IMAGE_TAG_ENV}"

          PARAMS_FILE=$(mktemp)
          printf '{"commands":[%s]}' "$(printf '%s' "$SCRIPT" | jq -Rs .)" > "$PARAMS_FILE"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "file://$PARAMS_FILE" \
            --region "$REGION" \
            --query "Command.CommandId" --output text)
          rm -f "$PARAMS_FILE"

          for i in $(seq 1 37); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --region "$REGION" --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "  [$i] SSM status: $STATUS"
            [[ "$STATUS" == "Success" || "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]] && break
          done

          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --region "$REGION" --query "StandardOutputContent" --output text 2>/dev/null || echo "")
          STDERR=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --region "$REGION" --query "StandardErrorContent" --output text 2>/dev/null || echo "")

          echo "--- Remote stdout ---"; echo "$OUTPUT"
          [ -n "$STDERR" ] && { echo "--- Remote stderr ---"; echo "$STDERR"; }
          [[ "$STATUS" != "Success" ]] && { echo "::error::SSM status: $STATUS"; exit 1; }

  invalidate:
    name: Invalidate CloudFront /admin/*
    needs: [promote]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: ./.github/actions/configure-aws
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve CloudFront Distribution ID
        id: resolve-dist
        run: |
          DIST_ID=$(aws ssm get-parameter \
            --name "/nextjs/${ENVIRONMENT}/cloudfront/distribution-id" \
            --query 'Parameter.Value' --output text)
          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "::error::CloudFront distribution ID not found in SSM"
            exit 1
          fi
          echo "dist-id=$DIST_ID" >> "$GITHUB_OUTPUT"

      - name: Create Invalidation
        env:
          DIST_ID: ${{ steps.resolve-dist.outputs.dist-id }}
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/admin/*" \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation ID: $INVALIDATION_ID"
