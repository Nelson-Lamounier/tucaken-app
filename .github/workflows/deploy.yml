name: "Deploy (Dev)"

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, SHA)"
        required: false
        default: "main"
        type: string
      no_cache:
        description: "Skip Docker layer cache (use for stale cache recovery)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

  repository_dispatch:
    types: [deploy-tucaken-app-dev]

permissions:
  id-token: write
  contents: read

env:
  ENVIRONMENT: development
  AWS_REGION: "eu-west-1"
  IMAGE_TAG: "${{ github.sha }}-r${{ github.run_attempt }}"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-ref:
    name: Resolve Deploy Ref
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      ref: ${{ steps.targets.outputs.ref }}
    steps:
      - name: Compute ref
        id: targets
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          PAYLOAD_REF: ${{ github.event.client_payload.ref }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            REF="$PUSH_SHA"
          else
            REF="${INPUT_REF:-${PAYLOAD_REF:-main}}"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Deploy ref: $REF"

  build:
    name: Build Docker Image
    needs: [resolve-ref]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ vars.ENVIRONMENT || 'development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: false
          tags: tucaken-app:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=tucaken-app
          cache-to: type=gha,mode=max,scope=tucaken-app
          no-cache: ${{ github.event.inputs.no_cache == 'true' }}
          provenance: false
          outputs: type=docker,dest=/tmp/app-image.tar
          build-args: |
            NODE_ENV=production

      - name: Cache Image
        uses: actions/cache/save@v4
        with:
          path: /tmp/app-image.tar
          key: app-image-${{ env.ENVIRONMENT }}-${{ github.run_id }}-${{ github.run_attempt }}

  push:
    name: Push to ECR
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ vars.ENVIRONMENT || 'development' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: ./.github/actions/configure-aws
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Restore Image from Cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/app-image.tar
          key: app-image-${{ env.ENVIRONMENT }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Load Docker Image
        run: docker load -i /tmp/app-image.tar

      - name: Resolve ECR URL
        id: resolve-ecr
        run: |
          ECR_URL=$(aws ssm get-parameter \
            --name "/shared/ecr-admin/${ENVIRONMENT}/repository-uri" \
            --query 'Parameter.Value' --output text)
          if [ -z "$ECR_URL" ] || [ "$ECR_URL" = "None" ]; then
            echo "::error::ECR URL not found in SSM"
            exit 1
          fi
          echo "::add-mask::$ECR_URL"
          echo "ecr-url=$ECR_URL" >> "$GITHUB_OUTPUT"

      - name: Push Image to ECR
        env:
          ECR_URL: ${{ steps.resolve-ecr.outputs.ecr-url }}
        run: |
          REGISTRY="${ECR_URL%%/*}"
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "$REGISTRY"
          docker tag "tucaken-app:${IMAGE_TAG}" "${ECR_URL}:${IMAGE_TAG}"
          docker push "${ECR_URL}:${IMAGE_TAG}"

  deploy:
    name: Update SSM (ArgoCD)
    needs: [push]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: ./.github/actions/configure-aws
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve Image URI
        id: resolve
        run: |
          ECR_URL=$(aws ssm get-parameter \
            --name "/shared/ecr-admin/${ENVIRONMENT}/repository-uri" \
            --query 'Parameter.Value' --output text)
          IMAGE_URI="${ECR_URL}:${IMAGE_TAG}"
          echo "::add-mask::$ECR_URL"
          echo "::add-mask::$IMAGE_URI"
          echo "image-uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Write Image URI to SSM
        env:
          IMAGE_URI: ${{ steps.resolve.outputs.image-uri }}
        run: |
          aws ssm put-parameter \
            --name "/tucaken-app/${ENVIRONMENT}/image-uri" \
            --value "$IMAGE_URI" \
            --type String --overwrite

  promote:
    
    
    needs: [deploy]
    runs-on: k8s-runner
    timeout-minutes: 20
    environment: development
    permissions:
      id-token: write
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: ./.github/actions/configure-aws
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up in-cluster kubeconfig
        run: |
          # The runner pod runs inside EKS — build kubectl config directly from
          # the mounted service account token and cluster CA. No SSM kubeconfig
          # needed (SSM still holds the stale kubeadm endpoint 127.0.0.1:6443).
          SA=/var/run/secrets/kubernetes.io/serviceaccount
          kubectl config set-cluster in-cluster \
            --server=https://kubernetes.default.svc:443 \
            --certificate-authority="${SA}/ca.crt"
          kubectl config set-credentials arc-runner \
            --token="$(cat ${SA}/token)"
          kubectl config set-context in-cluster \
            --cluster=in-cluster --user=arc-runner
          kubectl config use-context in-cluster

      # ── 0. Prometheus pre-flight ─────────────────────────────────────────────
      # The pre-promotion analysis queries Prometheus for error rate and P95
      # latency. A silent Prometheus failure causes the AnalysisRun to error
      # rather than fail cleanly, making the root cause harder to diagnose.
      # This step verifies Prometheus is healthy and the Traefik job is present
      # before the rollout starts — failing fast with a clear message.
      - name: Verify Prometheus is reachable
        env:
          PROM: "http://prometheus.monitoring.svc.cluster.local:9090/prometheus"
        run: |
          set -euo pipefail
          # Runner pod is already inside the cluster — curl Prometheus directly.
          # No extra pod creation needed (avoids the tucaken-app ResourceQuota
          # that requires explicit cpu/memory limits on every pod).
          echo '── Prometheus health ──'
          curl -sf "${PROM}/-/healthy" && echo ' OK'

          echo '── SLO recording rule reachable ──'
          STATUS=$(curl -sf "${PROM}/api/v1/query?query=slo:tucaken-app:errors_ratio:rate5m" \
            | grep -o '"status":"[^"]*"' | head -1)
          if [ "$STATUS" != '"status":"success"' ]; then
            echo "FAIL: SLO recording rule query failed — Prometheus may be missing the rule"
            exit 1
          fi
          echo "SLO recording rule reachable: OK"

      # ── 1. ArgoCD sync ───────────────────────────────────────────────────────
      # Separate step so you can tell at a glance in the GitHub UI whether a
      # hang is ArgoCD not reconciling vs. the rollout itself stalling.
      - name: Wait for ArgoCD sync
        env:
          IMAGE_TAG_ENV: ${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail
          ROLLOUT="tucaken-app"
          NAMESPACE="tucaken-app"
          # Budget: 40 × 15s = 10 min.
          # Image Updater scan interval (~2 min) + git write-back (~15s)
          # + ArgoCD reconcile (~30s) = ~3 min typical; 10 min absorbs
          # repo-server restarts and git clone cold-starts.
          echo "Waiting for ArgoCD to reconcile image: *${IMAGE_TAG_ENV}*"
          for i in $(seq 1 40); do
            SPEC_IMAGE=$(kubectl get rollout "$ROLLOUT" -n "$NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "<not found>")
            echo "[attempt ${i}/40] spec image: ${SPEC_IMAGE}"
            if [[ "$SPEC_IMAGE" == *"$IMAGE_TAG_ENV"* ]]; then
              echo "ArgoCD synced"
              break
            fi
            [[ "$i" -eq 40 ]] && {
              echo "FAIL: ArgoCD did not sync within 10 min"
              kubectl describe application -n argocd tucaken-app 2>/dev/null || true
              exit 1
            }
            sleep 15
          done

      # ── 2. Pre-promotion snapshot ─────────────────────────────────────────────
      # Full rollout state (ReplicaSets, canary steps, analysis) before promote.
      - name: Snapshot rollout state
        run: kubectl argo rollouts get rollout tucaken-app -n tucaken-app

      # ── 3. Wait for Paused phase then promote ─────────────────────────────────
      # Argo Rollouts pauses at the canary step boundary while pre-promotion
      # analysis runs. Prints phase + status message each attempt so you can
      # see exactly what the rollout controller is waiting on.
      - name: Wait for pre-promotion pause and promote
        run: |
          set -euo pipefail
          ROLLOUT="tucaken-app"
          NAMESPACE="tucaken-app"
          for i in $(seq 1 24); do
            PHASE=$(kubectl get rollout "$ROLLOUT" -n "$NAMESPACE" \
              -o jsonpath='{.status.phase}' 2>/dev/null || echo "unknown")
            MESSAGE=$(kubectl get rollout "$ROLLOUT" -n "$NAMESPACE" \
              -o jsonpath='{.status.message}' 2>/dev/null || echo "")
            echo "[attempt ${i}/24] phase=${PHASE}${MESSAGE:+ | ${MESSAGE}}"
            [[ "$PHASE" == "Paused" ]] && { echo "Rollout paused — promoting"; break; }
            [[ "$PHASE" == "Healthy" ]] && { echo "Already Healthy — no promotion needed"; exit 0; }
            [[ "$PHASE" == "Degraded" || "$PHASE" == "Error" ]] && {
              echo "FAIL: rollout entered ${PHASE} before promotion"
              kubectl argo rollouts get rollout "$ROLLOUT" -n "$NAMESPACE"
              exit 1
            }
            [[ "$i" -eq 24 ]] && {
              echo "FAIL: rollout did not pause within 6 min (phase=${PHASE})"
              kubectl argo rollouts get rollout "$ROLLOUT" -n "$NAMESPACE"
              exit 1
            }
            sleep 15
          done
          kubectl argo rollouts promote "$ROLLOUT" -n "$NAMESPACE"
          echo "Promote issued"

      # ── 4. Watch rollout to Healthy ───────────────────────────────────────────
      # `kubectl argo rollouts status` streams live output (step transitions,
      # replica counts, analysis results) rather than a silent sleep loop.
      # Exits 0 on Healthy, non-0 on Degraded or timeout.
      - name: Watch rollout to Healthy
        run: |
          set -euo pipefail
          kubectl argo rollouts status tucaken-app -n tucaken-app --timeout 10m
          echo "Rollout Healthy"

      # ── 5. Diagnostics on failure ─────────────────────────────────────────────
      # Fires automatically on any step failure. Dumps rollout detail, events,
      # pod state, recent logs, and analysis runs — everything needed to diagnose
      # without direct cluster access. Also posts a failure status to the GitHub
      # Environments tab via the ARC GitHub App token.
      - name: Dump diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          ROLLOUT="tucaken-app"
          NAMESPACE="tucaken-app"

          echo "──────────────── rollout detail ────────────────"
          kubectl argo rollouts get rollout "$ROLLOUT" -n "$NAMESPACE" || true

          echo "──────────────── rollout events ────────────────"
          kubectl get events -n "$NAMESPACE" \
            --field-selector "involvedObject.name=${ROLLOUT}" \
            --sort-by='.lastTimestamp' || true

          echo "──────────────── pods ──────────────────────────"
          kubectl get pods -n "$NAMESPACE" -o wide || true

          echo "──────────────── recent pod logs (last 50 lines) ───────────────"
          for POD in $(kubectl get pods -n "$NAMESPACE" \
            -l "app.kubernetes.io/name=${ROLLOUT}" \
            -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            echo "--- ${POD} ---"
            kubectl logs "$POD" -n "$NAMESPACE" --tail=50 2>/dev/null || true
          done

          echo "──────────────── analysis runs ─────────────────"
          kubectl get analysisrun -n "$NAMESPACE" \
            --sort-by='.metadata.creationTimestamp' 2>/dev/null | tail -5 || true

          # Post failure status to GitHub Environments tab via ARC GitHub App token.
          DEPLOY_ID=$(gh api "/repos/${GH_REPO}/deployments" \
            --jq ".[] | select(.sha == \"${GH_SHA}\" and .environment == \"development\") | .id" \
            2>/dev/null | head -1 || echo "")
          if [ -n "$DEPLOY_ID" ]; then
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GH_REPO}/deployments/${DEPLOY_ID}/statuses" \
              -f state=failure \
              -f description="Rollout did not become Healthy — see Actions log" \
              -f environment=development \
              2>/dev/null || true
          fi

  deploy-marker:
    name: Loki deploy marker
    needs: [resolve-ref, build, push, deploy, promote]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compute aggregate status
        id: agg
        env:
          STATUSES: ${{ toJSON(needs) }}
        run: |
          if echo "$STATUSES" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' > /dev/null; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "status=succeeded" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/loki-deploy-marker
        env:
          LOKI_PUSH_URL:        ${{ secrets.LOKI_PUSH_URL }}
          LOKI_PUSH_BASIC_AUTH: ${{ secrets.LOKI_PUSH_BASIC_AUTH }}
          PUSHGATEWAY_URL: ${{ secrets.PUSHGATEWAY_URL }}
          PUSHGATEWAY_BASIC_AUTH: ${{ secrets.PUSHGATEWAY_BASIC_AUTH }}
        with:
          service:     tucaken-app
          environment: development
          status:      ${{ steps.agg.outputs.status }}
          git-sha:     ${{ github.sha }}
          notes:       "tucaken-app deploy"
