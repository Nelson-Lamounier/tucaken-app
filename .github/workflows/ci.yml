name: Continuous Integration

on:
  # Run on pushes to main (post-merge) and on every PR. Feature-branch pushes are
  # covered by the pull_request event, so this avoids the duplicate push+PR runs
  # that previously raced (Sonar "CANCELLED", flaky type-check/build on one run).
  push:
    branches: [main]
  pull_request:
    branches: ['**']

# Cancel a superseded run for the same ref so rapid re-pushes don't pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

permissions:
  contents: read

jobs:
  setup:
    name: Setup Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      node-version: ${{ steps.nvmrc.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read .nvmrc
        id: nvmrc
        run: |
          if [ -f .nvmrc ]; then
            VERSION=$(cat .nvmrc | tr -d '[:space:]')
          else
            VERSION="${NODE_VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ steps.nvmrc.outputs.version }}

  audit:
    name: Security Audit
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
      - run: yarn npm audit --all --severity high

  lint:
    name: Lint
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
      - run: yarn lint

  typecheck:
    name: Type Check
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
      - run: yarn typecheck

  test:
    name: Unit Tests
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
      - run: yarn test

  admin-api-test:
    name: Admin API Unit Tests
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
      # admin-api uses Jest (root `yarn test` is vitest and does not cover it).
      # Includes the auth_provision_total metric-contract test guarding the
      # "Auth — Sign-In / Sign-Up Workflow" dashboard.
      - run: yarn workspace @repo/admin-api test

  admin-api-typecheck:
    name: Admin API Type Check
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
      - run: yarn workspace @repo/admin-api typecheck

  admin-api-lint:
    name: Admin API Lint
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
      - run: yarn workspace @repo/admin-api lint

  build:
    name: Build
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
      - run: yarn build
      - name: Verify build output
        run: |
          if [ -d "dist" ] && [ -f "dist/server/server.js" ]; then
            echo "Build output exists"
            du -sh dist
          else
            echo "Build output not found (expected dist/server/server.js)"
            exit 1
          fi

  docker-build:
    name: Docker Build Smoke Test
    needs: [setup, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: needs.build.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tucaken-app:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke Test Container
        run: |
          docker run -d --name test-container -p 5001:5001 tucaken-app:ci-test
          for i in $(seq 1 30); do
            if curl -sf --max-time 2 http://localhost:5001/sign-in > /dev/null 2>&1; then
              echo "Server ready (attempt $i)"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to start within 30s"
              docker logs test-container
              exit 1
            fi
            sleep 1
          done
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:5001/sign-in)
          if [ "$STATUS" -lt "500" ]; then
            echo "/sign-in returned $STATUS"
          else
            echo "/sign-in returned $STATUS (expected < 500)"
            docker logs test-container
            exit 1
          fi
          docker stop test-container && docker rm test-container

  ci-success:
    name: CI Complete
    needs: [audit, lint, typecheck, test, admin-api-typecheck, admin-api-lint, admin-api-test, build, docker-build]
    runs-on: ubuntu-latest
    if: always()
    env:
      AUDIT_RESULT: ${{ needs.audit.result }}
      LINT_RESULT: ${{ needs.lint.result }}
      TYPECHECK_RESULT: ${{ needs.typecheck.result }}
      TEST_RESULT: ${{ needs.test.result }}
      ADMIN_API_TYPECHECK_RESULT: ${{ needs.admin-api-typecheck.result }}
      ADMIN_API_LINT_RESULT: ${{ needs.admin-api-lint.result }}
      ADMIN_API_TEST_RESULT: ${{ needs.admin-api-test.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      DOCKER_BUILD_RESULT: ${{ needs.docker-build.result }}
    steps:
      - name: Check Results
        run: |
          FAILED=false
          for R in "$AUDIT_RESULT" "$LINT_RESULT" "$TYPECHECK_RESULT" "$TEST_RESULT" "$ADMIN_API_TYPECHECK_RESULT" "$ADMIN_API_LINT_RESULT" "$ADMIN_API_TEST_RESULT" "$BUILD_RESULT" "$DOCKER_BUILD_RESULT"; do
            if [ "$R" = "failure" ]; then FAILED=true; fi
            if [ "$R" = "cancelled" ]; then FAILED=true; fi
          done
          if [ "$FAILED" = "true" ]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"
