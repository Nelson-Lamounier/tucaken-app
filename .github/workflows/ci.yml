name: Continuous Integration

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

env:
  NODE_VERSION: '22'

permissions:
  contents: read

jobs:
  setup:
    name: Setup Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      node-version: ${{ steps.nvmrc.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read .nvmrc
        id: nvmrc
        run: |
          if [ -f .nvmrc ]; then
            VERSION=$(cat .nvmrc | tr -d '[:space:]')
          else
            VERSION="${NODE_VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ steps.nvmrc.outputs.version }}

  audit:
    name: Security Audit
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
      - run: yarn npm audit --all --severity high

  lint:
    name: Lint
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
      - run: yarn lint

  typecheck:
    name: Type Check
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
      - run: yarn typecheck

  test:
    name: Unit Tests
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
      - run: yarn test

  build:
    name: Build
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
      - run: yarn build
      - name: Verify build output
        run: |
          if [ -d "dist" ] && [ -f "dist/server/server.js" ]; then
            echo "Build output exists"
            du -sh dist
          else
            echo "Build output not found (expected dist/server/server.js)"
            exit 1
          fi

  docker-build:
    name: Docker Build Smoke Test
    needs: [setup, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: needs.build.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tucaken-app:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke Test Container
        run: |
          docker run -d --name test-container -p 5001:5001 tucaken-app:ci-test
          for i in $(seq 1 30); do
            if curl -sf --max-time 2 http://localhost:5001/admin/ > /dev/null 2>&1; then
              echo "Server ready (attempt $i)"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to start within 30s"
              docker logs test-container
              exit 1
            fi
            sleep 1
          done
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:5001/admin/)
          if [ "$STATUS" -lt "500" ]; then
            echo "/admin/ returned $STATUS"
          else
            echo "/admin/ returned $STATUS (expected < 500)"
            docker logs test-container
            exit 1
          fi
          docker stop test-container && docker rm test-container

  ci-success:
    name: CI Complete
    needs: [audit, lint, typecheck, test, build, docker-build]
    runs-on: ubuntu-latest
    if: always()
    env:
      LINT_RESULT: ${{ needs.lint.result }}
      TYPECHECK_RESULT: ${{ needs.typecheck.result }}
      TEST_RESULT: ${{ needs.test.result }}
      BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - name: Check Results
        run: |
          FAILED=false
          for R in "$LINT_RESULT" "$TYPECHECK_RESULT" "$TEST_RESULT" "$BUILD_RESULT"; do
            if [ "$R" = "failure" ]; then FAILED=true; fi
          done
          if [ "$FAILED" = "true" ]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"
