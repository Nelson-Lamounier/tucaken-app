# domain_map.yaml
# Generated by skill-domain-discovery
# Library: tucaken-app
# Version: initial-development (no semver — private SaaS)
# Date: 2026-04-30
# Status: reviewed

library:
  name: 'tucaken-app'
  version: 'initial-development'
  repository: 'private'
  description: >
    Tucaken is a SaaS application in initial development built on TanStack Start
    (SSR React), TanStack Router, TanStack Query v5, Tailwind CSS v4, and Zustand.
    It exposes a BFF (Backend For Frontend) layer via TanStack Start server
    functions that delegate all business logic to a separate admin-api service
    running in Kubernetes.
  primary_framework: 'React'

domains:
  - name: 'routing'
    slug: routing
    description: >
      Adding, structuring, and migrating TanStack Router file-based routes.
      Includes layout nesting, search param schemas, auth guards via beforeLoad,
      and the transition from flat _dashboard.*.tsx files to nested route groups.

  - name: 'data-fetching'
    slug: data-fetching
    description: >
      TanStack Query hooks (useQuery, useMutation), the adminKeys hierarchical
      key factory, polling patterns, and cache invalidation after mutations.

  - name: 'server-functions'
    slug: server-functions
    description: >
      TanStack Start createServerFn BFF layer — the only path to the admin-api
      backend. Covers auth guard, apiFetch helper, Zod input validation, error
      handling, and middleware composition.

  - name: 'feature-modules'
    slug: feature-modules
    description: >
      Structuring feature domains under src/features/<domain>/ with components,
      hooks, and types. Enforces reuse-first discovery before creating new code,
      and eliminates duplication across domains.

  - name: 'ui-components'
    slug: ui-components
    description: >
      Shared component library in src/components/ui/ and src/components/layouts/.
      Covers component reuse auditing, composition patterns, and the catalogue of
      existing building blocks (Button, DashboardPage, LinkCard, GridListActions, etc.).

  - name: 'security'
    slug: security
    description: >
      Auth guard enforcement, CSP configuration, OWASP-aligned header middleware,
      Zod input validation at BFF boundaries, and JWT handling patterns.

  - name: 'performance'
    slug: performance
    description: >
      React 19 render efficiency, bundle size, TanStack Start SSR hydration,
      Motion for React animation performance, and Tailwind v4 build constraints.

  - name: 'deployment'
    slug: deployment
    description: >
      K8s + ArgoCD + Argo Rollouts pipeline, Docker image build/push to AWS ECR,
      SSM-based config resolution, endpoint connectivity verification, and
      CloudFront cache invalidation.

  - name: 'maintainability'
    slug: maintainability
    description: >
      Code organisation as the codebase grows: eliminating duplication, improving
      naming consistency, restructuring flat routes and feature modules, and
      enforcing conventions that scale.

skills:
  # ── Routing ──────────────────────────────────────────────────────────────

  - name: 'Add Route'
    slug: add-route
    domain: routing
    description: >
      Add a new TanStack Router file-based route, connect it to the _dashboard
      layout, wire Zod search param validation, and register navigation in AppLayout.
    type: core
    covers:
      - createFileRoute
      - _dashboard layout inheritance via beforeLoad auth guard
      - Zod validateSearch schema
      - navigation[] and settingsNavigation[] arrays in AppLayout
      - DashboardPage wrapper component
      - disableMainWrapper flag for full-bleed routes
    tasks:
      - 'Add a settings page for a new integration'
      - 'Create a list route with status filter search params'
      - 'Add a detail route for an entity (e.g. /applications/:slug)'
    failure_modes:
      - mistake: 'Wrong file prefix — missing _dashboard. parent segment'
        mechanism: >
          TanStack Router derives the route tree from filenames. A file named
          settings.github.tsx creates a root-level /settings/github route with no
          auth guard. It must be _dashboard.settings.github.tsx to inherit the
          _dashboard layout's beforeLoad auth check.
        wrong_pattern: |
          // src/app/settings.github.tsx  ← root route, NO auth
          export const Route = createFileRoute('/settings/github')({ ... })
        correct_pattern: |
          // src/app/_dashboard.settings.github.tsx  ← inherits _dashboard auth
          export const Route = createFileRoute('/_dashboard/settings/github')({ ... })
        source: 'src/app/_dashboard.tsx + TanStack Router file-based routing docs'
        priority: CRITICAL
        status: active
        version_context: 'Pattern established at codebase bootstrap — always required'

      - mistake: 'Forgetting to add navigation entry in AppLayout'
        mechanism: >
          The route file creates the URL, but AppLayout.tsx hardcodes the navigation
          arrays. A new route without a matching nav entry is unreachable from the UI.
          The navigation[] and settingsNavigation[] arrays must be updated manually.
        wrong_pattern: |
          // Created _dashboard.settings.github.tsx but didn't touch AppLayout.tsx
          // User can't reach /settings/github from the sidebar
        correct_pattern: |
          // AppLayout.tsx
          const settingsNavigation = [
            { name: 'GitHub', href: '/settings/github', icon: Github },
            { name: 'NewFeature', href: '/settings/new-feature', icon: SomeIcon },
          ] as const
        source: 'src/components/layouts/AppLayout.tsx'
        priority: HIGH
        status: active

      - mistake: 'Using DashboardPage wrapper manually instead of component'
        mechanism: >
          Agents sometimes inline the title/description heading structure rather than
          using the DashboardPage component, producing inconsistent spacing and layout.
        wrong_pattern: |
          function MyRoute() {
            return (
              <div>
                <h2 className="text-2xl font-bold ...">Title</h2>
                <p className="mt-2 text-sm text-zinc-500">Description</p>
                {children}
              </div>
            )
          }
        correct_pattern: |
          import { DashboardPage } from '@/components/layouts/DashboardPage'
          function MyRoute() {
            return (
              <DashboardPage title="Title" description="Description">
                {children}
              </DashboardPage>
            )
          }
        source: 'src/components/layouts/DashboardPage.tsx'
        priority: HIGH
        status: active

  - name: 'Router Architecture'
    slug: router-architecture
    domain: routing
    description: >
      Migrate from the flat _dashboard.*.tsx file structure to TanStack Router
      nested route groups. Eliminates route sprawl, improves co-location, and
      makes the route tree maintainable as features grow.
    type: lifecycle
    covers:
      - TanStack Router route groups (directory-based nesting)
      - Layout route files (route.tsx pattern)
      - Migrating _dashboard.applications.*.tsx → applications/ directory
      - Preserving existing URLs during migration
    tasks:
      - 'Migrate applications routes to a nested group'
      - 'Create a settings route group for all settings pages'
      - 'Add a new multi-route feature without polluting the flat structure'
    failure_modes:
      - mistake: 'Breaking URL paths when moving to nested directories'
        mechanism: >
          TanStack Router maps the directory path to the URL. Moving
          _dashboard.applications.list.tsx to applications/list.tsx changes
          the route path unless the directory structure mirrors the URL exactly.
        wrong_pattern: |
          // Moving file to src/app/applications/list.tsx creates /applications/list
          // but the old path was /_dashboard/applications/list
          // — auth guard is lost
        correct_pattern: |
          // src/app/_dashboard/applications/list.tsx → /_dashboard/applications/list
          // OR keep _dashboard prefix convention and use route groups
          // Check TanStack Router docs for the exact nesting rules for your version
        source: 'TanStack Router file-based routing docs + vite.config.ts routesDirectory: app'
        priority: HIGH
        status: active

  # ── Data Fetching ─────────────────────────────────────────────────────────

  - name: 'Add Query'
    slug: add-query
    domain: data-fetching
    description: >
      Create a TanStack Query hook (useQuery or useMutation) using the adminKeys
      factory, wire to a server function, configure polling for live data, and
      invalidate related keys after mutations.
    type: core
    covers:
      - useQuery / useMutation from @tanstack/react-query
      - adminKeys hierarchical key factory in src/lib/api/query-keys.ts
      - refetchInterval with conditional polling (pending/syncing states)
      - queryClient.invalidateQueries after mutations
      - useToastStore for mutation feedback
      - staleTime (global default: 5 minutes)
    tasks:
      - 'Add a query for a new API resource'
      - 'Set up polling for a resource with in-progress states'
      - 'Invalidate multiple related queries after a mutation'
      - 'Wire toast feedback to mutation success/error'
    failure_modes:
      - mistake: 'Adding query keys inline instead of extending adminKeys factory'
        mechanism: >
          Inline query keys like ['github', 'installation'] cannot be reliably
          invalidated by namespace. adminKeys.github.all covers all github queries;
          an inline key is isolated and breaks hierarchical cache clearing.
        wrong_pattern: |
          useQuery({
            queryKey: ['github', 'installation'],
            queryFn: getGitHubInstallationFn,
          })
        correct_pattern: |
          // 1. Add to src/lib/api/query-keys.ts:
          github: {
            all: ['admin', 'github'] as const,
            installation: () => ['admin', 'github', 'installation'] as const,
          }
          // 2. Use in hook:
          useQuery({
            queryKey: adminKeys.github.installation(),
            queryFn: getGitHubInstallationFn,
          })
        source: 'src/lib/api/query-keys.ts'
        priority: CRITICAL
        status: active

      - mistake: 'Polling with fixed refetchInterval instead of conditional'
        mechanism: >
          A fixed refetchInterval polls forever, even when data is stable.
          The Tucaken pattern checks data state inside refetchInterval callback
          and returns false when no active rows remain, with a timeout fallback.
        wrong_pattern: |
          useQuery({ queryKey: [...], queryFn: fn, refetchInterval: 5000 })
        correct_pattern: |
          useQuery({
            queryKey: adminKeys.github.connectedRepos(),
            queryFn: getGitHubConnectedReposFn,
            refetchInterval: (queryResult) => {
              const data = queryResult.state.data
              if (!data) return false
              const hasActive = data.some((r) => ACTIVE_STATUSES.has(r.syncStatus))
              return hasActive ? 5_000 : false
            },
          })
        source: 'src/features/github/hooks/use-github-connected-repos.ts'
        priority: HIGH
        status: active

      - mistake: 'Missing cache invalidation after mutation'
        mechanism: >
          useMutation onSuccess must invalidate all related query keys or stale
          data persists in the UI until the next natural refetch.
        wrong_pattern: |
          useMutation({ mutationFn: removeConnectedRepoFn })
          // No invalidation — list shows removed repo until page reload
        correct_pattern: |
          useMutation({
            mutationFn: (repoFullName: string) => removeConnectedRepoFn({ data: { repoFullName } }),
            onSuccess: () => {
              void queryClient.invalidateQueries({ queryKey: adminKeys.github.connectedRepos() })
              void queryClient.invalidateQueries({ queryKey: adminKeys.github.accessibleRepos() })
              addToast('success', 'Repository removed.')
            },
          })
        source: 'src/features/github/components/GitHubConnectedRepos.tsx'
        priority: HIGH
        status: active

  # ── Server Functions ──────────────────────────────────────────────────────

  - name: 'Add Server Function'
    slug: add-server-function
    domain: server-functions
    description: >
      Create a TanStack Start createServerFn handler following the Tucaken BFF
      pattern: requireAuth → getSessionToken → apiFetch. Covers Zod input
      validation, method selection, error propagation, and testing with Vitest.
    type: core
    covers:
      - "createServerFn({ method: 'GET' | 'POST' }) from @tanstack/react-start"
      - requireAuth() from src/server/auth-guard.ts
      - getSessionToken() pattern (getCookie + null guard)
      - apiFetch<T>() generic BFF helper
      - .inputValidator(zodSchema) chaining
      - ADMIN_API_URL env var (default: http://admin-api.admin-api:3002)
      - Vitest mocking pattern (vi.mock createServerFn, vi.stubGlobal fetch)
      - AuthenticationError class for auth failures
    tasks:
      - 'Add a GET endpoint to fetch a new resource type'
      - 'Add a POST endpoint to create or trigger an operation'
      - 'Add a DELETE endpoint with URL-encoded path params'
      - 'Write Vitest tests for a new server function'
    failure_modes:
      - mistake: "Using method: 'GET' for mutation server functions"
        mechanism: >
          TanStack Start enforces HTTP semantics. createServerFn({ method: 'GET' })
          cannot receive a body. Mutations (POST, DELETE operations) must use
          method: 'POST' even if the underlying admin-api call is a DELETE,
          because the BFF layer maps all write operations through POST.
        wrong_pattern: |
          export const deleteThingFn = createServerFn({ method: 'GET' })
            .inputValidator(z.object({ id: z.string() }))
            .handler(async ({ data }) => { ... })
        correct_pattern: |
          export const deleteThingFn = createServerFn({ method: 'POST' })
            .inputValidator(z.object({ id: z.string() }))
            .handler(async ({ data }) => {
              await requireAuth()
              return apiFetch(`/things/${encodeURIComponent(data.id)}`, { method: 'DELETE' })
            })
        source: 'src/server/github.ts + TanStack Start server functions docs'
        priority: CRITICAL
        status: active

      - mistake: 'Omitting requireAuth() call inside handler'
        mechanism: >
          requireAuth() is not automatically applied — it must be called at the
          top of every handler. Omitting it creates an unauthenticated endpoint
          accessible from the browser without a valid session cookie.
        wrong_pattern: |
          export const getThingFn = createServerFn({ method: 'GET' })
            .handler(async () => {
              // No requireAuth() — anyone can call this
              return apiFetch('/things')
            })
        correct_pattern: |
          export const getThingFn = createServerFn({ method: 'GET' })
            .handler(async () => {
              await requireAuth()
              return apiFetch('/things')
            })
        source: 'src/server/auth-guard.ts'
        priority: CRITICAL
        status: active

      - mistake: "Using wrong import path alias — #/ instead of @/"
        mechanism: >
          The codebase defines two aliases: @/ (Vite/Vitest, src/) used in all
          source files, and #/ (Node.js package imports, also src/) for ESM
          compatibility. Agents familiar with #/ from package.json sometimes use
          it in component/server imports where @/ is required.
        wrong_pattern: |
          import { requireAuth } from '#/server/auth-guard'
          import type { ConnectedRepo } from '#/lib/types/github.types'
        correct_pattern: |
          import { requireAuth } from '@/server/auth-guard'
          import type { ConnectedRepo } from '@/lib/types/github.types'
        source: 'vite.config.ts + package.json imports field'
        priority: HIGH
        status: active

      - mistake: 'Calling getCookie() outside server function handler context'
        mechanism: >
          getCookie() from @tanstack/react-start/server only works inside a
          server function handler. Calling it at module level or inside a
          plain async function throws at runtime.
        wrong_pattern: |
          // Module-level call — crashes on import
          const token = getCookie('__session')
          export async function apiFetch(path: string) { ... }
        correct_pattern: |
          // Inside handler only
          export const getThingFn = createServerFn({ method: 'GET' })
            .handler(async () => {
              await requireAuth()
              const token = getCookie('__session') // safe here
              ...
            })
        source: 'src/server/applications.ts — getSessionToken() pattern'
        priority: HIGH
        status: active

      - mistake: 'Silently ingesting admin-api 404 as data instead of null'
        mechanism: >
          When admin-api returns 404 (resource not found), apiFetch throws.
          The correct pattern catches the 404 specifically and returns null
          so UI can show "not connected" state rather than crashing.
        wrong_pattern: |
          const body = await apiFetch<{ installation: GitHubInstallation }>('/github/installation')
          return body.installation // throws if 404 — unhandled
        correct_pattern: |
          try {
            const body = await apiFetch<{ installation: GitHubInstallation }>('/github/installation')
            return body.installation
          } catch (err) {
            if (err instanceof Error && err.message.startsWith('admin-api 404')) return null
            throw err
          }
        source: 'src/server/github.ts — getGitHubInstallationFn'
        priority: HIGH
        status: active

  # ── Feature Modules ───────────────────────────────────────────────────────

  - name: 'Add Feature Domain'
    slug: add-feature-domain
    domain: feature-modules
    description: >
      Scaffold a new feature module under src/features/<domain>/ with the
      canonical subdirectory structure (components/, hooks/, types exported
      via lib/types/). Follows reuse-first: audit src/components/ui/ before
      creating any new component.
    type: core
    covers:
      - Feature directory structure: components/, hooks/
      - Type files in src/lib/types/<domain>.types.ts
      - Query key namespace in src/lib/api/query-keys.ts
      - Server functions in src/server/<domain>.ts
      - Vitest tests in src/__tests__/server/<domain>.test.ts
      - Component reuse audit before creating new UI
    tasks:
      - 'Scaffold a new product feature (e.g. notifications, billing, projects)'
      - 'Understand where to place new code in the current structure'
      - 'Add types and query keys for a new domain'
    failure_modes:
      - mistake: 'Creating new UI components that duplicate existing ones'
        mechanism: >
          src/components/ui/ contains Button (6 variants), DashboardPage,
          LinkCard, GridListActions, DashboardDrawer, Field, Tabs, Stats,
          Pagination, and more. Agents often create one-off inline components
          rather than using or extending what exists.
        wrong_pattern: |
          // Creating a custom badge component without checking existing ones
          function StatusBadge({ status }: { status: string }) {
            return <span className="rounded px-2 py-0.5 text-xs ...">{status}</span>
          }
          // When GitHubSyncStatusBadge already implements this exact pattern
        correct_pattern: |
          // 1. Run: find src/components -name "*.tsx" | xargs grep -l "badge\|chip\|status"
          // 2. Check src/components/ui/ for matching abstractions
          // 3. Extend existing component or follow its exact pattern
          import { GitHubSyncStatusBadge } from '@/features/github/components/GitHubSyncStatusBadge'
        source: 'src/components/ui/ — full component catalogue'
        priority: HIGH
        status: active

      - mistake: 'Using useMutation directly for user-facing forms instead of TanStack Form'
        mechanism: >
          TanStack Form + @tanstack/zod-form-adapter is the intended pattern for
          all user-facing forms. Raw useMutation works for one-off triggers but
          misses field-level validation, dirty state, submission state, and the
          consistent form lifecycle TanStack Form provides. Agents default to
          useMutation because it requires less setup.
        wrong_pattern: |
          // Direct mutation for a multi-field form — quick fix, wrong pattern
          const mutation = useMutation({ mutationFn: createApplicationFn })
          function handleSubmit(e: React.FormEvent) {
            e.preventDefault()
            mutation.mutate({ title, company, url })
          }
        correct_pattern: |
          import { useForm } from '@tanstack/react-form'
          import { zodValidator } from '@tanstack/zod-form-adapter'
          const form = useForm({
            defaultValues: { title: '', company: '', url: '' },
            validatorAdapter: zodValidator(),
            onSubmit: async ({ value }) => {
              await createApplicationFn({ data: value })
            },
          })
        source: 'package.json — @tanstack/react-form + @tanstack/zod-form-adapter; maintainer interview'
        priority: HIGH
        status: active

      - mistake: 'Placing server functions inside feature directory'
        mechanism: >
          Server functions live in src/server/<domain>.ts, not inside
          src/features/<domain>/. Placing them inside the feature module
          breaks the architectural separation between the BFF layer and UI.
        wrong_pattern: |
          src/features/github/server/github.ts  ← wrong location
        correct_pattern: |
          src/server/github.ts  ← all server functions live here
          src/features/github/hooks/use-github-installation.ts  ← hooks call server fns
        source: 'src/server/ directory structure'
        priority: HIGH
        status: active

  # ── UI Components ──────────────────────────────────────────────────────────

  - name: 'Component Reuse Audit'
    slug: component-reuse-audit
    domain: ui-components
    description: >
      Before creating any UI component, scan src/components/ui/ and existing
      feature components for matching patterns. Document the existing catalogue
      and the decision criteria for composing vs. creating new.
    type: core
    covers:
      - Button (variants: primary, secondary, danger, danger-lg, warning, ghost)
      - AddButton, RemoveButton, AddSubItemButton, RemoveSubItemButton, HeaderLink
      - DashboardPage (title, description, actions, headerBottom, fullWidth)
      - LinkCard (title, subtitle, icon, topRight, bottom, onClick)
      - GridListActions (hub/landing page action grid)
      - DashboardDrawer, Field, Tabs, TabUnderline, TabbedContainer
      - Stats, StatsCard, Pagination, CardPagination
      - SectionHeader, FullWidthBar, ProgressBar
      - Toaster (via useToastStore)
      - PipelineNotificationWatcher
    tasks:
      - 'Check if a loading state component already exists'
      - 'Find the right button variant for a destructive action'
      - 'Identify which layout wrapper to use for a new page'
      - 'Determine if a list/card pattern is already implemented'
    failure_modes:
      - mistake: 'Using raw <button> instead of Button component'
        mechanism: >
          The Button component provides all focus, disabled, and transition styles
          consistently. Raw buttons miss focus-visible rings, disabled opacity,
          and cursor styles. Always import Button from @/components/ui/Button.
        wrong_pattern: |
          <button onClick={handler} className="px-3 py-1 text-xs text-red-400 border ...">
            Delete
          </button>
        correct_pattern: |
          import { Button } from '@/components/ui/Button'
          <Button variant="danger" onClick={handler}>Delete</Button>
        source: 'src/components/ui/Button.tsx'
        priority: MEDIUM
        status: active

      - mistake: "Importing from 'framer-motion' instead of 'motion/react'"
        mechanism: >
          Framer Motion was renamed Motion for React. The package is installed as
          motion/react. Any import from framer-motion will fail at runtime.
        wrong_pattern: |
          import { motion, AnimatePresence } from 'framer-motion'
        correct_pattern: |
          import { motion, AnimatePresence } from 'motion/react'
          // Server components only:
          import * as motion from 'motion/react-client'
        source: '.claude/rules/motion-react.md'
        priority: CRITICAL
        status: active

  # ── Security ──────────────────────────────────────────────────────────────

  - name: 'Security Review'
    slug: security-review
    domain: security
    description: >
      Audit server functions, auth guards, Zod validation, CSP, and response
      headers for vulnerabilities. Covers OWASP Top 10 patterns relevant to
      the BFF/SaaS architecture.
    type: lifecycle
    covers:
      - requireAuth() presence on every server function handler
      - securityHeadersMiddleware (HSTS, X-Frame-Options, CSP, etc.)
      - Zod inputValidator on all POST handlers with user-supplied data
      - encodeURIComponent for path params in apiFetch
      - JWT forwarding pattern (Bearer token, not stored in JS)
      - CSP connect-src allowlist maintenance
      - No sensitive data in client-side bundle (env vars, secrets)
    tasks:
      - 'Audit a new server function for security gaps before shipping'
      - 'Review a pull request for OWASP Top 10 issues'
      - 'Check that CSP headers cover a new third-party service'
    failure_modes:
      - mistake: 'Attaching securityHeadersMiddleware only to getUserSessionFn'
        mechanism: >
          The current codebase only attaches securityHeadersMiddleware to
          getUserSessionFn. Industry best practice requires security headers on
          all server responses. Every server function should either attach the
          middleware directly or a global middleware layer should cover all routes.
          Without this, direct API calls to other server functions return responses
          without HSTS, X-Frame-Options, CSP, etc.
        wrong_pattern: |
          // Only on session function — other endpoints unprotected
          export const getUserSessionFn = createServerFn({ method: 'GET' })
            .middleware([securityHeadersMiddleware])
            .handler(async () => { ... })

          export const getThingsFn = createServerFn({ method: 'GET' })
            .handler(async () => { ... }) // ← no security headers
        correct_pattern: |
          // Apply to all server functions, or use a global middleware approach
          export const getThingsFn = createServerFn({ method: 'GET' })
            .middleware([securityHeadersMiddleware])
            .handler(async () => {
              await requireAuth()
              return apiFetch('/things')
            })
        source: 'src/server/security-headers.ts; maintainer interview — follow industry best practices'
        priority: HIGH
        status: active

      - mistake: 'Missing requireAuth() on a new server function'
        mechanism: >
          Every server function is a network endpoint. Without requireAuth(),
          any unauthenticated caller can invoke it. This is the #1 security
          gap in BFF codebases.
        source: 'src/server/auth-guard.ts'
        priority: CRITICAL
        status: active
        skills: ['add-server-function', 'security-review']

      - mistake: 'URL-encoding omitted for user-supplied path segments'
        mechanism: >
          Passing a raw string like repoFullName in a URL path allows path
          traversal. All user-supplied path segments must be passed through
          encodeURIComponent before use in apiFetch paths.
        wrong_pattern: |
          return apiFetch(`/github/connected-repos/${data.repoFullName}`, { method: 'DELETE' })
        correct_pattern: |
          return apiFetch(`/github/connected-repos/${encodeURIComponent(data.repoFullName)}`, { method: 'DELETE' })
        source: 'src/server/github.ts — removeConnectedRepoFn'
        priority: HIGH
        status: active

      - mistake: 'Exposing server-only env vars in VITE_ prefix'
        mechanism: >
          Variables prefixed VITE_ are embedded in the client bundle and visible
          to all users. Only non-sensitive config (e.g. VITE_GITHUB_APP_SLUG)
          should use this prefix. Secrets, API keys, and internal URLs must use
          unprefixed env vars (process.env) which remain server-only.
        wrong_pattern: |
          const secret = import.meta.env.VITE_ADMIN_API_SECRET // exposed to browser
        correct_pattern: |
          // Server function only — stays out of bundle
          const adminApiUrl = process.env['ADMIN_API_URL'] ?? 'http://admin-api.admin-api:3002'
        source: 'src/server/applications.ts — ADMIN_API_URL pattern'
        priority: CRITICAL
        status: active

  # ── Performance ────────────────────────────────────────────────────────────

  - name: 'Code Optimisation'
    slug: code-optimisation
    domain: performance
    description: >
      Identify and fix render inefficiencies, bundle bloat, and SSR hydration
      issues in the TanStack Start + React 19 + Tailwind v4 stack.
    type: lifecycle
    covers:
      - React 19 useMemo / useCallback for referential stability
      - SSR-unsafe browser API access (window, document, localStorage)
      - Lazy-loaded devtools (TanStackDevtools pattern in __root.tsx)
      - Tailwind v4 build constraints (client-only, separate SSR build)
      - Motion for React willChange and independent transform performance
      - TanStack Query staleTime configuration
    tasks:
      - 'Reduce unnecessary re-renders in a list component'
      - 'Fix a hydration mismatch from server/client state divergence'
      - 'Lazy-load a heavy component to reduce initial bundle'
    failure_modes:
      - mistake: 'Accessing window/localStorage during SSR render'
        mechanism: >
          TanStack Start renders on the server where window is undefined.
          Direct access throws ReferenceError. Must be inside useEffect or
          guarded by typeof window !== undefined.
        wrong_pattern: |
          const theme = localStorage.getItem('start-admin-theme') // crashes on server
        correct_pattern: |
          // In __root.tsx — inline script runs before paint to avoid flash
          useEffect(() => {
            const theme = localStorage.getItem('start-admin-theme')
          }, [])
        source: 'src/app/__root.tsx — ANTI_FLASH_SCRIPT pattern'
        priority: HIGH
        status: active

      - mistake: 'Importing Motion from framer-motion in a server component'
        mechanism: >
          Server components cannot use framer-motion (renamed motion/react).
          Additionally, server components require the motion/react-client import.
        wrong_pattern: |
          import { motion } from 'framer-motion' // wrong package name
        correct_pattern: |
          // Client component (use client at top):
          import { motion } from 'motion/react'
          // Server component:
          import * as motion from 'motion/react-client'
        source: '.claude/rules/motion-react.md'
        priority: HIGH
        status: active
        skills: ['code-optimisation', 'component-reuse-audit']

  # ── Deployment ─────────────────────────────────────────────────────────────

  - name: 'Verify Endpoint Connectivity'
    slug: verify-endpoint-connectivity
    domain: deployment
    description: >
      Confirm that a server function correctly reaches the admin-api pod endpoint.
      Covers ADMIN_API_URL resolution, auth header forwarding, response shape
      validation, and pod log inspection patterns.
    type: core
    covers:
      - ADMIN_API_URL env var (K8s in-cluster default: http://admin-api.admin-api:3002)
      - Authorization: Bearer <JWT> forwarding pattern
      - apiFetch error surface (admin-api <status>: <body>)
      - Vitest mock pattern for fetch to verify URL + headers
      - K8s pod log access for server-side errors
    tasks:
      - 'Verify a new server function hits the correct admin-api endpoint'
      - 'Debug a 401/403 from admin-api in the server function layer'
      - 'Check that ADMIN_API_URL is correctly injected in the K8s deployment'
    failure_modes:
      - mistake: 'Hardcoding admin-api URL instead of using env var'
        mechanism: >
          The ADMIN_API_URL defaults to the K8s in-cluster DNS name. Hardcoding
          localhost or a different URL breaks the deployed container.
        wrong_pattern: |
          const res = await fetch('http://localhost:3002/api/admin/things', { ... })
        correct_pattern: |
          const ADMIN_API_URL = process.env['ADMIN_API_URL'] ?? 'http://admin-api.admin-api:3002'
          const res = await fetch(`${ADMIN_API_URL}/api/admin/things`, { ... })
        source: 'src/server/applications.ts — ADMIN_API_URL constant'
        priority: CRITICAL
        status: active

      - mistake: 'Forgetting Authorization header in apiFetch override'
        mechanism: >
          The shared apiFetch helper adds the Bearer token automatically. If a
          handler bypasses apiFetch and calls fetch() directly, it must manually
          add Authorization: Bearer <token> or admin-api returns 401.
        wrong_pattern: |
          const res = await fetch(`${ADMIN_API_URL}/api/admin/things`) // no auth header
        correct_pattern: |
          // Use shared apiFetch — it adds Bearer automatically
          return apiFetch<ThingResponse>('/things')
        source: 'src/server/applications.ts — apiFetch helper'
        priority: HIGH
        status: active

  - name: 'Pre-Deploy Checklist'
    slug: pre-deploy-checklist
    domain: deployment
    description: >
      Pre-deploy gate: CI green, auth guard present, security headers valid,
      env vars wired, TypeScript clean, tests passing, ArgoCD rollout verified.
    type: lifecycle
    covers:
      - GitHub Actions CI (lint, typecheck, test, build, docker-build jobs)
      - ArgoCD sync + Argo Rollouts promote sequence
      - CloudFront /admin/* cache invalidation
      - ADMIN_API_URL + VITE_* env var checklist
      - Docker smoke test (HTTP < 500 on /admin/)
    tasks:
      - 'Run through pre-deploy checks before merging to main'
      - 'Verify CI is green before triggering a deploy'
      - 'Confirm the ArgoCD rollout promoted successfully'
    failure_modes:
      - mistake: 'Skipping typecheck — CI catches it but wastes pipeline time'
        mechanism: >
          yarn typecheck must pass locally before push. TSC errors in server
          function types are common after adding new Zod schemas or API types.
        source: '.github/workflows/ci.yml — typecheck job'
        priority: MEDIUM
        status: active

  # ── Maintainability ────────────────────────────────────────────────────────

  - name: 'Maintainability Review'
    slug: maintainability-review
    domain: maintainability
    description: >
      Assess a module or feature for duplication, coupling, and naming
      consistency. Produce actionable refactor steps aligned with Tucaken's
      evolving structure conventions.
    type: lifecycle
    covers:
      - Component duplication detection (search before create)
      - Naming consistency (PascalCase components, kebab-case files, camelCase hooks)
      - Feature boundary violations (server logic in feature/, UI in server/)
      - adminKeys completeness for all domain queries
      - Zustand store scope (UI state only — no server data)
    tasks:
      - 'Review a feature module before merging to ensure no duplication'
      - 'Audit naming conventions across a new feature'
      - 'Check that Zustand stores do not cache server data'
    failure_modes:
      - mistake: 'Structure drift — placing files where convenient rather than where architecture requires'
        mechanism: >
          Agents place code where it solves the immediate problem: inline
          components inside route files, server logic inside feature/, types
          defined locally next to the component that uses them. Each placement
          works at the time but violates the separation that makes the codebase
          maintainable. The canonical structure: server fns → src/server/,
          types → src/lib/types/, hooks → src/features/<domain>/hooks/,
          shared UI → src/components/ui/ or src/components/layouts/.
        wrong_pattern: |
          // src/app/_dashboard.settings.billing.tsx
          // Inline: server fn, type def, and component all in one file
          async function fetchBillingFn() { ... }          // should be src/server/billing.ts
          interface BillingPlan { ... }                    // should be src/lib/types/billing.types.ts
          function BillingCard({ plan }: { plan: BillingPlan }) { ... } // should be src/features/billing/
        correct_pattern: |
          // src/server/billing.ts          ← server functions
          // src/lib/types/billing.types.ts ← types
          // src/features/billing/components/BillingCard.tsx ← feature component
          // src/features/billing/hooks/use-billing-plan.ts  ← query hook
          // src/app/_dashboard.settings.billing.tsx         ← route (thin — just wires)
        source: 'maintainer interview — agents create point-in-time fixes not lifecycle-permanent structure'
        priority: CRITICAL
        status: active

      - mistake: 'Point-in-time fix — solving the immediate task without considering codebase lifecycle'
        mechanism: >
          Agents optimise for the current task: hardcode a value instead of using
          an env var, duplicate a component instead of reusing, add an inline
          query key instead of extending adminKeys. Each decision works now but
          accumulates debt that blocks future changes. Every implementation
          decision should be evaluated against: "will this still be correct in
          6 months when the codebase has grown?"
        source: 'maintainer interview — long-term maintainability over short-term convenience'
        priority: HIGH
        status: active

      - mistake: 'Storing server response data in Zustand'
        mechanism: >
          Zustand stores manage UI state only (filters, modal open/closed, tabs).
          Server data belongs in TanStack Query cache. Duplicating it in Zustand
          creates sync bugs where store and query disagree.
        wrong_pattern: |
          const useGithubStore = create(() => ({
            repos: [] as ConnectedRepo[], // ← server data — belongs in TQ
            setRepos: (repos: ConnectedRepo[]) => set({ repos }),
          }))
        correct_pattern: |
          // Query manages server data
          const { data: repos } = useGitHubConnectedRepos()
          // Zustand manages UI-only state
          const useGithubUIStore = create(() => ({
            selectedRepoId: null as string | null,
          }))
        source: 'src/lib/stores/ — existing stores are UI-only'
        priority: HIGH
        status: active

  - name: 'Restructure Module'
    slug: restructure-module
    domain: maintainability
    description: >
      Move or rename files and directories to align with Tucaken's evolving
      best-practice structure without breaking TypeScript path resolution,
      TanStack Router route derivation, or CI.
    type: lifecycle
    covers:
      - "@/ alias import updates across moved files"
      - TanStack Router filename → URL mapping during moves
      - Updating AppLayout navigation after route path changes
      - Running tsc --noEmit + vitest run after every structural change
    tasks:
      - 'Move a component from one feature to shared components'
      - 'Rename a feature directory without breaking imports'
      - 'Split a large route file into smaller co-located components'
    failure_modes:
      - mistake: 'Moving a file without updating all @/ imports'
        mechanism: >
          TypeScript path aliases are relative to src/. Moving a file changes
          its @/ path. tsc --noEmit will catch broken imports but only if run
          after the move.
        source: 'vite.config.ts + tsconfig.json paths'
        priority: HIGH
        status: active

  # ── Lifecycle ──────────────────────────────────────────────────────────────

  - name: 'Getting Started'
    slug: getting-started
    domain: feature-modules
    description: >
      Onboard a new developer: clone → install → env vars → local dev → understand
      the BFF/admin-api boundary → understand the route/feature/server function
      architecture.
    type: lifecycle
    covers:
      - Yarn 4 (corepack enable + yarn install)
      - Path alias (@/ → src/) and dual-alias situation (#/)
      - ADMIN_API_URL local dev proxy (vite.config.ts /admin/api → localhost:3000)
      - VITE_GITHUB_APP_SLUG and other VITE_ env vars
      - BFF boundary: tucaken-app owns UI + server functions; admin-api owns DB + K8s
      - TanStack devtools (Router + Query) available in development
    tasks:
      - 'Set up local development environment'
      - 'Understand where to add code for a new feature'
      - 'Understand which service owns which responsibility'

  - name: 'Ship Feature'
    slug: ship-feature
    domain: feature-modules
    description: >
      End-to-end checklist: implement feature → component reuse audit → server
      function tests → typecheck → lint → vitest → smoke test → conventional
      commit → CI green → merge to main → deploy.
    type: lifecycle
    covers:
      - Component reuse audit before any new UI
      - Vitest tests for all server functions (src/__tests__/server/)
      - yarn typecheck + yarn lint before commit
      - "Conventional commit format (feat(scope): ..., fix(scope): ...)"
      - GitHub Actions CI pipeline gates
      - ArgoCD rollout promotion sequence
    tasks:
      - 'Ship a new feature from first line of code to production'
      - 'Ensure all quality gates pass before merge'

tensions:
  - name: 'SSR correctness vs client-only convenience'
    skills: ['add-route', 'code-optimisation']
    description: >
      TanStack Start renders routes on the server, but browser APIs
      (window, localStorage, document) are unavailable during SSR.
    implication: >
      Agents add browser API calls at module level or in render, producing
      ReferenceError on the server or hydration mismatches on the client.

  - name: 'BFF security vs development velocity'
    skills: ['add-server-function', 'security-review']
    description: >
      Every server function must call requireAuth() and validate input with Zod,
      but these steps are easy to omit when rapidly scaffolding new endpoints.
    implication: >
      Agents scaffold server functions without requireAuth() or inputValidator,
      creating unauthenticated endpoints that pass TypeScript but fail security review.

  - name: 'Reuse-first vs create-first'
    skills: ['component-reuse-audit', 'add-feature-domain']
    description: >
      The component library is growing but not yet fully catalogued. Agents
      default to creating new components before checking what exists.
    implication: >
      Duplication accumulates — two StatusBadge implementations, three card
      patterns, multiple button wrappers — making maintainability harder as the
      codebase grows.

  - name: 'Flat route convenience vs nested route scalability'
    skills: ['router-architecture', 'add-route']
    description: >
      The current flat _dashboard.*.tsx structure is easy to add to but produces
      a sprawling, hard-to-navigate route directory at scale.
    implication: >
      Agents add new _dashboard.feature.page.tsx files, deepening the flat
      structure further instead of creating nested route groups.

cross_references:
  - from: add-server-function
    to: add-query
    reason: >
      Server functions are always paired with a TanStack Query hook.
      Understanding both together prevents method/queryKey mismatches.
  - from: add-route
    to: component-reuse-audit
    reason: >
      Every new route needs a DashboardPage wrapper and layout components.
      Check the catalogue first.
  - from: ship-feature
    to: security-review
    reason: >
      Ship Feature checklist includes a security gate — knowing what to check
      prevents last-minute review failures.
  - from: add-feature-domain
    to: maintainability-review
    reason: >
      New feature modules should be reviewed for duplication and naming
      consistency before merging.
  - from: verify-endpoint-connectivity
    to: add-server-function
    reason: >
      Connectivity verification requires understanding the apiFetch pattern
      and ADMIN_API_URL injection used in every server function.
  - from: router-architecture
    to: add-route
    reason: >
      Understanding the target nested structure prevents adding more flat routes
      that will need migration later.

